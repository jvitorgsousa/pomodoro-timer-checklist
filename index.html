<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Focatto | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!--  AQUI É SÓ DO LADO ESQUERDO -->
        <div class="left">
            <div class="logo">
                <div class="icon"><img src="Images/clock.png" alt="Ícone Focatto" width="115px" height="115px"></div>
            </div>

            <h1>Focatto</h1>

            <p class="subtitle">
                Aumente sua produtividade com a técnica Pomodoro.<br>
                Organize seu tempo, alcance seus objetivos.
            </p>

            <div class="stats">
                <div class="card">
                    <strong>25</strong>
                    <span>min foco</span>
                </div>
                <div class="card">
                    <strong>5</strong>
                    <span>min pausa</span>
                </div>
                <div class="card">
                    <strong>4</strong>
                    <span>ciclos</span>
                </div>
            </div>
        </div>

        <!-- AQUI SÓ PARA O LADO DIREITO -->
        <div class="right">
            <div class="form-card">

                <h2>Bem-vindo de volta!</h2>
                <p>Entre com suas credenciais para continuar</p>
        
                <form>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
        
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
        
                    <div class="row">
                        <a href="#">Esqueceu a senha?</a>
                    </div>
        
                    <div class="checkbox">
                        <input type="checkbox" id="lembrar">
                        <label for="lembrar">Manter-me conectado</label>
                    </div>
        
                    <button type="submit" class="btn">Entrar</button>
                </form>
        
                <div class="divider"> ou </div>
        
                <div class="social">
                    <button class="btn-google" onclick="entrarComGoogle()">Google</button>
                    <button class="btn-github" onclick="entrarComGithub()">GitHub</button>
                </div>
        
                <div class="footer">
                    Não tem uma conta? <a href="register.html">Criar conta</a>
                </div>
        
            </div>
        </div>

</body>

</html>
