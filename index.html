<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Focatto | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!--  AQUI É SÓ DO LADO ESQUERDO -->
        <div class="left">
            <div class="logo">
                <div class="icon">⏱</div>
                <h1>Focatto</h1>
            </div>

            <p class="subtitle">
                Aumente sua produtividade com a técnica Pomodoro.<br>
                Organize seu tempo, alcance seus objetivos.
            </p>

            <div class="stats">
                <div class="card">
                    <strong>25</strong>
                    <span>min foco</span>
                </div>
                <div class="card">
                    <strong>5</strong>
                    <span>min pausa</span>
                </div>
                <div class="card">
                    <strong>4</strong>
                    <span>ciclos</span>
                </div>
            </div>
        </div>

        <!-- AQUI SÓ PARA O LADO DIREITO -->
        <div class="right">
            <h2>Bem-vindo de volta!</h2>
            <p>Entre com suas credenciais para continuar</p>

            <form>
                <label>Email</label>
                <input type="email" placeholder="seu@email.com">

                <div class="row">
                    <label>Senha</label>
                    <a href="#">Esqueceu a senha?</a>
                </div>
                <input type="password" placeholder="Digite sua senha">

                <div class="checkbox">
                    <input type="checkbox">
                    <span>Manter-me conectado</span>
                </div>

                <button class="btn">Entrar</button>

                <div class="divider">ou</div>

                <div class="social">
                    <button>Google</button>
                    <button>GitHub</button>
                </div>

                <p class="footer">
                    Não tem uma conta? <a href="register.html">Criar conta</a>
                </p>
            </form>
        </div>
    </div>

</body>

</html>
