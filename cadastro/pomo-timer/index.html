<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focatto - Pomodoro</title>

    <link rel="icon" type="image/png" href="../images/clock-focatto.png?v=2">

    <link rel="stylesheet" href="styles.css">
    <!-- Isso é para esses ícones de fonte (para ▶, ↺, etc.) ficarem bonitinhos >-< -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="mode-foco">
    <header>
        <div class="logo">
            <i class="fas fa-stopwatch" style="color: rgb(255, 255, 255);"></i> Focatto
        </div>
        <div class="header-icons">
            <i id="settings-icon" class="fas fa-bars settings"></i>
        </div>
    </header>

    <!-- Barra lateral de cria -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <button id="close-sidebar" class="close-btn">&times;</button>
            <h3>Perfil</h3>
        </div>

        <div class="sidebar-profile">
            <img class="profile-img" src="https://via.placeholder.com/80" alt="Foto do usuário">
        
            <h4 id="user-name">Carregando...</h4>
            <p id="user-email">...</p>
        </div>

        <!-- Esses terem não estão funcionando, por enquanto, mas temos que fazer funcionar -->
        <div class="profile-stats">
        
            <div class="stat-item">
                <span>🔥</span>
                <span id="profile-minutes">0</span> minutos focados hoje
            </div>
        
            <div class="stat-item">
                <span>🍅</span>
                <span id="profile-sessions">0</span> sessões concluídas
            </div>
        
            <div class="stat-item">
                <span>🏆</span>
                <span id="profile-streak">0</span> dias seguidos focando
            </div>
        
        </div>

        <div class="sidebar-footer">
            <button id="tasks-btn" class="tasks-btn">
                <i class="fas fa-tasks"></i> Minhas tarefas
            </button>

            <button id="logout-btn" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Sair da conta
            </button>
        </div>
    </div>

    <div class="task-section">
        <label for="task-input">Tarefa atual para este foco:</label>
        <input type="text" id="task-input" placeholder="Ex: Estudar matemática" />
        <button id="assign-task-btn">Atribuir & Iniciar</button>
    </div>
    
    <!-- Overlay escuro quando sidebar aberta -->
    <div id="overlay" class="overlay"></div>

    <!-- Modos / Tabs -->
    <div class="modes">
        <button class="mode-btn active" data-mode="foco">Foco</button>
        <button class="mode-btn" data-mode="pausa-curta">Pausa Curta</button>
        <button class="mode-btn" data-mode="pausa-longa">Pausa Longa</button>
    </div>

    <!-- Container principal do timer -->
    <div class="timer-container">
        <div id= "mode-icon" class="mode-icon">🧠</div> <!-- Pelo amor de Deus, procure um íncone menos chamativo -->

        <div class="timer-wrapper">
            <button id="decrease-time" class="adjust-btn">-</button>
            <p class="timer">25:00</p>
            <button id="increase-time" class="adjust-btn">+</button>
        </div>

        <p id="current-task" class="current-task"></p>

        <p class="subtitle">Tempo de Foco</p>

        <!-- Botões de ação -->
        <div class="actions">
            <button id="timer-start" class="action-btn">
                <i class="fas fa-play"></i> Iniciar
            </button>

            <button id="timer-reset" class="action-btn">
                <i class="fas fa-redo"></i> Reiniciar
            </button>
        </div>
    
        <!-- Contadores -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">0</div>
                <div class="stat-label">Sessões Completas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">0</div>
                <div class="stat-label">Minutos de Foco</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">0</div>
                <div class="stat-label">Ciclos Completos</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgH4qv7kq5SEdMkOPqHvICZeGV8bPCqIo",
            authDomain: "focattoprojeto.firebaseapp.com",
            projectId: "focattoprojeto",
            storageBucket: "focattoprojeto.firebasestorage.app",
            messagingSenderId: "633395578221",
            appId: "1:633395578221:web:db9e05a09b8754f7728664",
            measurementId: "G-L5C3G8J4HL"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();

        // Função que atualiza a sidebar com dados
        function atualizarPerfil(user) {
            const nomeElemento = document.getElementById("user-name");
            const emailElemento = document.getElementById("user-email");
            const fotoElemento = document.querySelector(".profile-img");

            if (user) {

                let nome = user.displayName;

                if (!nome && user.email) {
                    nome = user.email.split("@")[0];
                }

                if (nome) {
                    nome = nome.split(" ")[0];
                }

                nomeElemento.textContent = nome;

                // pegar email
                let email = user.email;

                if (!email && user.providerData && user.providerData.length > 0) {
                    email = user.providerData[0].email;
                }

                emailElemento.textContent = email || "Email não disponível";

                if (user.photoURL) {
                    fotoElemento.src = user.photoURL;
                } else {
                    const inicial = nome.charAt(0).toUpperCase();
                    fotoElemento.src = "https://ui-avatars.com/api/?name=" + inicial;
                }

            } else {
                // Não está logado
                nomeElemento.textContent = "Faça login";
                emailElemento.textContent = "Para acessar o perfil";
                fotoElemento.src = "https://ui-avatars.com/api/?name=?";
                fotoElemento.alt = "Usuário não logado";
            }
        }

        document.getElementById('tasks-btn').addEventListener('click', function () {
                window.location.href = 'minhas-tarefas.html';
            });

        // Atualiza sempre que o estado de autenticação muda (carrega página, login, logout)
        auth.onAuthStateChanged((user) => {
            console.log(user.providerData);
            atualizarPerfil(user);
        });

        // Logout
        window.addEventListener("DOMContentLoaded", () => {

                const logoutBtn = document.getElementById("logout-btn");

                logoutBtn.addEventListener("click", () => {
                    auth.signOut().then(() => {
                        window.location.href = "../index.html";
                    });

                });

            });
    </script>

    <script src="app.js"></script>
</body>

</html>
