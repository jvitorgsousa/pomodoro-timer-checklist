<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Focatto | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!--  AQUI É SÓ DO LADO ESQUERDO -->
        <div class="left">
            <div class="logo">
                <div class="icon"><img src="Images/clock.png" alt="Ícone Focatto" width="115px" height="115px"></div>
            </div>

            <h1>Focatto</h1>

            <p class="subtitle">
                Aumente sua produtividade com a técnica Pomodoro.<br>
                Organize seu tempo, alcance seus objetivos.
            </p>

            <div class="stats">
                <div class="card">
                    <strong>25</strong>
                    <span>min foco</span>
                </div>
                <div class="card">
                    <strong>5</strong>
                    <span>min pausa</span>
                </div>
                <div class="card">
                    <strong>4</strong>
                    <span>ciclos</span>
                </div>
            </div>
        </div>

        <!-- AQUI SÓ PARA O LADO DIREITO -->
        <div class="right">
            <div class="form-card">

                <h2>Bem-vindo de volta!</h2>
                <p>Entre com suas credenciais para continuar</p>
        
                <form>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
        
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
        
                    <div class="row">
                        <a href="#">Esqueceu a senha?</a>
                    </div>
        
                    <div class="checkbox">
                        <input type="checkbox" id="lembrar">
                        <label for="lembrar">Manter-me conectado</label>
                    </div>
        
                    <button type="submit" class="btn">Entrar</button>
                </form>
        
                <div class="divider"> ou </div>
        
                <div class="social">
                    <button type="button" class="btn-google" onclick="entrarComGoogle()">Google</button>
                    <button type="button" class="btn-github" onclick="entrarComGithub()">GitHub</button>
                </div>
        
                <div class="footer">
                    Não tem uma conta? <a href="register.html">Criar conta</a>
                </div>
        
            </div>
        </div>

        <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

        <script>
                const firebaseConfig = {
                    apiKey: "AIzaSyBgH4qv7kq5SEdMkOPqHvICZeGV8bPCqIo",
                    authDomain: "focattoprojeto.firebaseapp.com",
                    projectId: "focattoprojeto",
                    storageBucket: "focattoprojeto.firebasestorage.app",
                    messagingSenderId: "633395578221",
                    appId: "1:633395578221:web:db9e05a09b8754f7728664",
                    measurementId: "G-L5C3G8J4HL"
                };

                firebase.initializeApp(firebaseConfig);
                const auth = firebase.auth();

                // Login Google
                function entrarComGoogle() {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(provider)
                        .then((result) => {
                            const user = result.user;
                            console.log("Logado com Google!", user.displayName, user.email, user.uid);
                            alert("Bem-vindo, " + (user.displayName || user.email) + "!");
                            window.location.href = "app.html";
                        })
                        .catch((error) => {
                            console.error("Erro no Google:", error.code, error.message);
                            alert("Erro ao entrar com Google: " + error.message);
                        });
                }

                // Login com o GitHub
                function entrarComGithub() {
                    const provider = new firebase.auth.GithubAuthProvider();
                    auth.signInWithPopup(provider)
                        .then((result) => {
                            const user = result.user;
                            console.log("Logado com GitHub!", user.displayName, user.email, user.uid);
                            alert("Bem-vindo, " + (user.displayName || user.email) + "!");
                            window.location.href = "app.html";
                        })
                        .catch((error) => {
                            console.error("Erro no GitHub:", error.code, error.message);
                            alert("Erro ao entrar com GitHub: " + error.message);
                        });
                }

                // Se já estiver logado ele redireciona pra página principal
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        console.log("Já logado:", user.email);
                        window.location.href = "app.html";
                    }
                });
            
            //SPANS

            const formLogin = document.querySelector('form');
            const emailInput = document.getElementById('email');
            const senhaInput = document.getElementById('senha');
            const checkboxManter = document.getElementById('lembrar');

            // Cria um span para mostrar erros (se ainda não tiver, adicionamos dinamicamente)
            let erroSpan = document.querySelector('#erroLogin');
            if (!erroSpan) {
                erroSpan = document.createElement('span');
                erroSpan.id = 'erroLogin';
                erroSpan.className = 'erro';
                erroSpan.style.color = 'red';
                erroSpan.style.fontSize = '13px';
                erroSpan.style.marginTop = '10px';
                erroSpan.style.display = 'block';
                formLogin.insertBefore(erroSpan, formLogin.querySelector('button[type="submit"]'));
            }

            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault(); // Impede recarregar a página

                // Limpa erro anterior
                erroSpan.textContent = '';

                const email = emailInput.value.trim();
                const senha = senhaInput.value;

                // Validações
                if (!email || !senha) {
                    erroSpan.textContent = 'Preencha email e senha.';
                    return;
                }

                if (!email.includes('@') || !email.includes('.')) {
                    erroSpan.textContent = 'Email parece inválido.';
                    emailInput.focus();
                    return;
                }

                // Envia para o backend
                try {
                    const response = await fetch('http://localhost:3000/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, senha })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Longin feito com sucesso, data.user tem as informações do usuário
                        console.log('Usuário logado:', data.user);

                        // Se "Manter-me conectado" estiver marcado, salva no localStorage
                        if (checkboxManter.checked) {
                            localStorage.setItem('userLogado', JSON.stringify(data.user));

                        } else {
                            sessionStorage.setItem('userLogado', JSON.stringify(data.user));
                        }

                        alert('Login realizado com sucesso! Bem-vindo de volta, ' + data.user.nome + '!');

                        // Redireciona para a página principal (EU COLOQUEI COMO DASHBOARD, MAS TU COLOCA COM O NOME QUE TU TIVER COLOCADO AÍ)
                        window.location.href = 'dashboard.html';
                    } else {
                        erroSpan.textContent = data.error || 'Erro ao fazer login. Tente novamente.';
                    }
                } catch (err) {
                    console.error('Erro na requisição:', err);
                    erroSpan.textContent = 'Erro ao conectar com o servidor. Verifique se o backend está rodando.';
                }
            });

        </script>

</body>

</html>
