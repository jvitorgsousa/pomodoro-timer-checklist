<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Focatto | Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="left">
            <div class="logo">
                <div class="icon">⏱</div>
                <h1>Focatto</h1>
            </div>

            <p class="subtitle">
                Aumente sua produtividade com a técnica Pomodoro.<br>
                Organize seu tempo, alcance seus objetivos.
            </p>

            <div class="stats">
                <div class="card">
                    <strong>25</strong>
                    <span>min foco</span>
                </div>
                <div class="card">
                    <strong>5</strong>
                    <span>min pausa</span>
                </div>
                <div class="card">
                    <strong>4</strong>
                    <span>ciclos</span>
                </div>
            </div>
        </div>

        <div class="right">
            <h2>Criar Conta</h2>
            <p>Preencha seus dados para começar a usar o Focatto</p>

            <form>
                <label>Nome completo</label>
                <input type="text" placeholder="Digite seu nome">

                <label>Email</label>
                <input type="email" placeholder="seu@email.com">

                <label>Senha</label>
                <input type="password" placeholder="Mínimo 8 caracteres">

                <label>Confirmar senha</label>
                <input type="password" placeholder="Digite a senha novamente">

                <button class="btn">Criar minha conta</button>

                <p class="footer">
                    Já possui uma conta? <a href="index.html">Fazer login</a>
                </p>
            </form>
        </div>
    </div>

</body>

</html>
